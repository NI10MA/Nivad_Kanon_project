<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود و ثبت‌ نام | سازمان دانش‌آموزی استان همدان</title>

    <link rel="stylesheet" href="css/Login.css">

    <script src="js/Login.js" defer></script>
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <!-- Close Button -->
            <a href="index.html" class="close-button" aria-label="بازگشت به صفحه اصلی">
                ×
            </a>

            <!-- Form Card -->
            <section class="auth-card">

                <!-- Tabs -->
                <div class="auth-tabs" role="tablist">

                    <button
                        type="button"
                        role="tab"
                        aria-selected="true"
                        class="auth-tab active"
                        id="signupTab"
                    >
                        ثبت‌ نام
                    </button>

                    <button
                        type="button"
                        role="tab"
                        aria-selected="false"
                        class="auth-tab"
                        id="loginTab"
                    >
                        ورود
                    </button>

                </div>

                <!-- Signup Form -->
                <form id="signupForm" class="auth-form">

                    <div class="form-heading">
                        <h1>ایجاد حساب کاربری</h1>
                        <p>به خانواده آموزشی کانون دانش‌آموزی استان همدان بپیوندید</p>
                    </div>

                    <div class="form-group">
                        <label for="signupUsername">نام کاربری</label>
                        <input
                            type="text"
                            id="signupUsername"
                            placeholder="حروف انگلیسی، عدد یا زیرخط (۳ تا ۲۴ کاراکتر)"
                            minlength="3"
                            maxlength="24"
                            autocomplete="username"
                            dir="ltr"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="signupFullName">نام و نام خانوادگی</label>
                        <input type="text" id="signupFullName" placeholder="نام و نام خانوادگی دانش‌آموز" maxlength="120" autocomplete="name" required>
                    </div>

                    <div class="form-group">
                        <label for="signupNationalCode">کد ملی دانش‌آموز (اختیاری - جهت اتصال خودکار دوره‌ها)</label>
                        <input type="text" id="signupNationalCode" placeholder="۱۰ رقم بدون خط تیره" maxlength="10" dir="ltr">
                    </div>

                    <div class="form-group">
                        <label for="signupPhone">شماره تماس والد / سرپرست</label>
                        <input type="tel" id="signupPhone" placeholder="09xxxxxxxxx" maxlength="20" autocomplete="tel" dir="ltr" required>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">رمز عبور</label>
                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="حداقل ۸ کاراکتر"
                            minlength="8"
                            autocomplete="new-password"
                            dir="ltr"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">تکرار رمز عبور</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="رمز عبور را دوباره وارد کنید"
                            minlength="8"
                            autocomplete="new-password"
                            dir="ltr"
                            required
                        >
                    </div>

                    <button type="submit" class="submit-button">
                        ساخت حساب کاربری
                    </button>

                    <p class="form-message" id="signupMessage" aria-live="polite"></p>

                    <p class="form-switch-text">
                        قبلاً حساب ساخته‌اید؟
                        <button type="button" data-switch="login">
                            وارد شوید
                        </button>
                    </p>

                </form>

                <!-- Login Form -->
                <form id="loginForm" class="auth-form hidden">

                    <div class="form-heading">
                        <h1>خوش آمدید!</h1>
                        <p>برای ورود به پنل کاربری یا پنل مدیریت اطلاعات خود را وارد کنید</p>
                    </div>

                    <div class="form-group">
                        <label for="loginUsername">نام کاربری</label>
                        <input
                            type="text"
                            id="loginUsername"
                            placeholder="نام کاربری خود را وارد کنید"
                            autocomplete="username"
                            dir="ltr"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">رمز عبور</label>
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="رمز عبور خود را وارد کنید"
                            autocomplete="current-password"
                            dir="ltr"
                            required
                        >
                    </div>

                    <button type="submit" class="submit-button">
                        ورود به حساب
                    </button>

                    <p class="form-message" id="loginMessage" aria-live="polite"></p>

                    <p class="form-switch-text">
                        هنوز حساب ندارید؟
                        <button type="button" data-switch="signup">
                            ثبت‌ نام کنید
                        </button>
                    </p>

                </form>

            </section>

            <p class="auth-footer">
                © تمامی حقوق برای سازمان دانش‌آموزی استان همدان محفوظ است.
            </p>

        </div>

    </main>

</body>
</html>
